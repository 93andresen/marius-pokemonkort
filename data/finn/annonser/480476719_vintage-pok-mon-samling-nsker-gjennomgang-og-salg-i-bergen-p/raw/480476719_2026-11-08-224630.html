tene så grundig jeg klarer og skilt ut dem jeg mener er ekte. Jeg synes selv jeg har gjort en grundig jobb, men jeg er ingen ekspert og kan derfor ikke garantere at alle er riktig vurdert.</p><p> </p><p>Jeg ønsker helst å selge til noen i Bergensområdet som vil møtes og se gjennom kortene før et eventuelt kjøp. Da får du undersøkt både ekthet og tilstand selv. Jeg ønsker å være åpen om usikkerheten og unngå å sende kort frem og tilbake i posten.</p><p> </p><p>Samlet veiledende verdi for kortene jeg mener er ekte, er beregnet til **ca. 13 690 kr**, basert på PriceCharting-priser. Dette er et prisestimat, og tilstanden er ikke vurdert individuelt i beregningen. Kortene varierer en del i tilstand: Noen er veldig fine, mens andre har tydelig slitasje. Jeg vil ikke beskrive noen av dem som «near mint».</p><p> </p><p>Jeg tar gjerne imot bud på hele samlingen og er sikker på at vi kan bli enige om en god pris, med hensyn til tilstand på kortene.</p><p> </p><p>Du kan også få se gjennom bunken jeg har sortert ut som antatt falske kort. Dersom noen av disse viser seg å være ekte, kan vi avtale å inkludere dem i handelen. Kort som er falske, selges ikke som del av samlingen.</p><p> </p><p>Bud på hele samlingen uten besiktigelse er også velkomne, men da må usikkerheten rundt ekthet og tilstand være forstått og avklart før kjøpet. Jeg tilbyr ikke frivillig retur, og foretrekker derfor at kjøper undersøker kortene på forhånd.</p><p> </p><p>Send gjerne en melding ved interesse eller for å avtale en titt på kortene!</p><p> </p><p> </p><p> </p><p>Samlet veiledende verdi: 13 690 kr</p><p> </p><p>**Base Set – 1999**</p><p>- Abra #43 – 17 kr (2 stk.)</p><p>- Kakuna #33 – 18 kr</p><p>- Machop [Shadowless] #52 – 25 kr</p><p>- Metapod [1999–2000] #54 – 38 kr</p><p>- Pidgey #57 – 19 kr</p><p>- Ponyta [1999–2000] #60 – 31 kr</p><p>- Porygon [1999–2000] #39 – 88 kr</p><p> </p><p>**Jungle – 1999**</p><p>- Exeggcute #52 – 10 kr</p><p>- Lickitung #38 – 22 kr</p><p>- Rhydon #45 – 17 kr</p><p> </  underholdning\"}}},\"images\":[{\"uri\":\"https://images.finncdn.no/dynamic/default/item/480476719/7d216747-72ae-4ae8-83ca-efcdcc74c7e1\",\"width\":512,\"height\":512,\"description\":\"\"},{\"uri\":\"https://images.finncdn.no/dynamic/default/item/480476719/aaf08371-56ab-445b-b7b1-04bccf3b5a5c\",\"width\":512,\"height\":512,\"description\":\"Bunke med kort jeg mener er ekte til venstre, bunke med kort jeg desverre tror er fake til høyre\"},{\"uri\":\"https://images.finncdn.no/dynamic/default/item/480476719/ea35f24d-4152-4c20-823e-278b10ede680\",\"width\":512,\"height\":512},{\"uri\":\"https://images.finncdn.no/dynamic/default/item/480476719/3fbed330-bc42-408e-8443-83a72909b9a9\",\"width\":512,\"height\":512,\"description\":\"\"},{\"uri\":\"https://images.finncdn.no/dynamic/default/item/480476719/366fa1a0-9628-4853-9c92-3ca9db8437ac\",\"width\":512,\"height\":512},{\"uri\":\"https://images.finncdn.no/dynamic/default/item/480476719/f432b22e-5a4f-408b-b0c4-8bc742a4904d\",\"width\":512,\"height\":512,\"description\":\"Tror desverre disse to er fake\"}],\"disposed\":false,\"adViewTypeLabel\":\"Til salgs\",\"description\":\"Jeg fant nylig en bunke Pokémon-kort i boden fra samlingen jeg hadde da jeg var yngre. \\n\\nDessverre ser det ut til at samlingen inneholdt en blanding av ekte og falske kort. Jeg har undersøkt kortene så grundig jeg klarer og skilt ut dem jeg mener er ekte. Jeg synes selv jeg har gjort en grundig jobb, men jeg er ingen ekspert og kan derfor ikke garantere at alle er riktig vurdert.\\n\\nJeg ønsker helst å selge til noen i Bergensområdet som vil møtes og se gjennom kortene før et eventuelt kjøp. Da får du undersøkt både ekthet og tilstand selv. Jeg ønsker å være åpen om usikkerheten og unngå å sende kort frem og tilbake i posten.\\n\\nSamlet veiledende verdi for kortene jeg mener er ekte, er beregnet til **ca. 13 690 kr**, basert på PriceCharting-priser. Dette er et prisestimat, og tilstanden er ikke vurdert individuelt i beregningen. Kortene varierer en del i tilstand: Noen er veldig fine, mens andre har tydelig slitasje. Jeg vil ikke beskrive noen av dem som «near mint».\\n\\nJeg tar gjerne imot bud på hele samlingen og er sikker på at vi kan bli enige om en god pris, med hensyn til tilstand på kortene.\\n\\nDu kan også få se gjennom bunken jeg har sortert ut som antatt falske kort. Dersom noen av disse viser seg å være ekte, kan vi avtale å inkludere dem i handelen. Kort som er falske, selges ikke som del av samlingen.\\n\\nBud på hele samlingen uten besiktigelse er også velkomne, men da må usikkerheten rundt ekthet og tilstand være forstått og avklart før kjøpet. Jeg tilbyr ikke frivillig retur, og foretrekker derfor at kjøper undersøker kortene på forhånd.\\n\\nSend gjerne en melding ved interesse eller for å avtale en titt på kortene!\\n\\n\\n\\nSamlet veiledende verdi: 13 690 kr\\n\\n**Base Set – 1999**\\n- Abra #43 – 17 kr (2 stk.)\\n- Kakuna #33 – 18 kr\\n- Machop [Shadowless] #52 – 25 kr\\n- Metapod [1999–2000] #54 – 38 kr\\n- Pidgey #57 – 19 kr\\n- Ponyta [1999–2000] #60 – 31 kr\\n- Porygon [1999–2000] #39 – 88 kr\\n\\n**Jungle – 1999**\\n- Exeggcute #52 – 10 kr\\n- Lickitung #38 – 22 kr\\n- Rhydon #45 – 17 kr\\n\\n**Fossil – 1999**\\n- Mysterious Fossil #62 – 11 kr\\n\\n**Base Set 2 – 2000**\\n- Bellsprout #66 – 13 kr\\n- Meowth #80 – 18 kr\\n- Potion #122 – 9 kr\\n\\n**Team Rocket – 2000**\\n- Dark Raticate #51 – 19 kr\\n\\n**Gym Heroes – 2000**\\n- Blaine's Kangaskhan #36 – 47 kr\\n- Blaine's Ponyta #63 – 19 kr\\n- Brock's Geodude #38 – 25 kr\\n- Brock's Mankey #68 – 14 kr\\n- Brock's Onix #69 – 24 kr\\n- Erika's Exeggcute #77 – 16 kr\\n- Lt. Surge's Magnemite #50 – 22 kr\\n- Lt. Surge's Raticate #51 – 21 kr\\n- Lt. Surge's Spearow #52 – 16 kr\\n- Misty's Poliwag #87 – 17 kr\\n- Misty's Tentacool #57 – 23 kr\\n- Sabrina's Venonat #96 – 16 kr\\n\\n**Gym Challenge – 2000**\\n- Koga's Pidgey #80 – 18 kr\\n\\n**Expedition – 2002**\\n- Electabuzz [Reverse Holo] #76 – 330 kr\\n\\n**Aquapolis – 2003**\\n-
